<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 92" fill="none">
  <defs>
    <!-- Warm Radiant Sun Radial Gradient -->
    <radialGradient id="favSunGlow" cx="46" cy="46" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="45%" stop-color="#FEF08A" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <!-- Barni Glazed Ceramic Gradient -->
    <linearGradient id="favJarGlaze" x1="55" y1="58" x2="77" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FAF6EF" />
      <stop offset="100%" stop-color="#E7DECE" />
    </linearGradient>

    <!-- Ochre Neck Collar Gradient -->
    <linearGradient id="favJarOchre" x1="55" y1="54" x2="77" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Saree Odhni Gradient -->
    <linearGradient id="favSareeGrad" x1="23" y1="22" x2="59" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 2)">
    <!-- 1. ROTATING SUN RAYS -->
    <g>
      <animateTransform 
        attributeName="transform" 
        attributeType="XML" 
        type="rotate" 
        from="0 46 44" 
        to="360 46 44" 
        dur="24s" 
        repeatCount="indefinite" 
      />
      <!-- 16 Sunburst Rays around (46, 44) -->
      <path d="M 46 3 L 49.5 14 L 42.5 14 Z" fill="#F59E0B" />
      <path d="M 46 3 L 49.5 14 L 42.5 14 Z" fill="#FBBF24" transform="rotate(22.5 46 44)" />
      <path d="M 46 3 L 49.5 14 L 42.5 14 Z" fill="#EA580C" transform="rotate(45 46 44)" />
      <path d="M 46 3 L 49.5 14 L 42.5 14 Z" fill="#FBBF24" transform="rotate(67.5 46 44)" />
      <path d="M 46 3 L 49.5 14 L 42.5 14 Z" fill="#F59E0B" transform="rotate(90 46 44)" />
      <path d="M 46 3 L 49.5 14 L 42.5 14 Z" fill="#FBBF24" transform="rotate(112.5 46 44)" />
      <path d="M 46 3 L 49.5 14 L 42.5 14 Z" fill="#EA580C" transform="rotate(135 46 44)" />
      <path d="M 46 3 L 49.5 14 L 42.5 14 Z" fill="#FBBF24" transform="rotate(157.5 46 44)" />
      <path d="M 46 3 L 49.5 14 L 42.5 14 Z" fill="#F59E0B" transform="rotate(180 46 44)" />
      <path d="M 46 3 L 49.5 14 L 42.5 14 Z" fill="#FBBF24" transform="rotate(202.5 46 44)" />
      <path d="M 46 3 L 49.5 14 L 42.5 14 Z" fill="#EA580C" transform="rotate(225 46 44)" />
      <path d="M 46 3 L 49.5 14 L 42.5 14 Z" fill="#FBBF24" transform="rotate(247.5 46 44)" />
      <path d="M 46 3 L 49.5 14 L 42.5 14 Z" fill="#F59E0B" transform="rotate(270 46 44)" />
      <path d="M 46 3 L 49.5 14 L 42.5 14 Z" fill="#FBBF24" transform="rotate(292.5 46 44)" />
      <path d="M 46 3 L 49.5 14 L 42.5 14 Z" fill="#EA580C" transform="rotate(315 46 44)" />
      <path d="M 46 3 L 49.5 14 L 42.5 14 Z" fill="#FBBF24" transform="rotate(337.5 46 44)" />
    </g>

    <!-- 2. WARM SUN DISC -->
    <circle cx="46" cy="44" r="33.5" fill="url(#favSunGlow)" stroke="#F59E0B" stroke-width="1.8" />
    <circle cx="46" cy="44" r="30.5" fill="none" stroke="#FEF08A" stroke-width="1" stroke-dasharray="2 2" opacity="0.7" />

    <!-- 3. CARTOON INDIAN LADY (DESI DIDI) -->
    <!-- Back Pallu / Saree Hood behind head -->
    <path d="M 23 48 C 21 28, 29 16, 42 16 C 55 16, 63 28, 61 48 C 61 58, 59 66, 56 72 L 28 72 C 25 66, 23 58, 23 48 Z" fill="url(#favSareeGrad)" />
    <!-- Golden Gota-Patti Lace border on Odhni -->
    <path d="M 24 50 C 23 30, 30 18, 42 18 C 54 18, 61 30, 60 50" fill="none" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" />

    <!-- Saree Blouse / Shoulders -->
    <path d="M 25 58 C 25 54, 36 53, 42 53 C 48 53, 58 54, 58 58 L 58 75 L 25 75 Z" fill="#15803D" />
    <!-- Front Pallu -->
    <path d="M 25 58 Q 38 64 57 74 L 54 75 Q 36 67 25 62 Z" fill="#B91C1C" />
    <path d="M 25 58 Q 38 64 57 74" stroke="#FBBF24" stroke-width="1.5" fill="none" />

    <!-- Hair -->
    <path d="M 30 33 C 32 26, 38 23, 42 26 C 46 23, 52 26, 54 33 C 49 29, 35 29, 30 33 Z" fill="#1C1917" />
    <circle cx="42" cy="22" r="5" fill="#1C1917" />

    <!-- Cute Friendly Face -->
    <path d="M 31 32 C 30 43, 35 49, 42 49 C 49 49, 54 43, 53 32 C 48 34, 36 34, 31 32 Z" fill="#FED7AA" stroke="#FDBA74" stroke-width="0.6" />

    <!-- Rosy Cheeks Blush -->
    <ellipse cx="34" cy="41" rx="3.2" ry="1.8" fill="#F87171" opacity="0.45" />
    <ellipse cx="50" cy="41" rx="3.2" ry="1.8" fill="#F87171" opacity="0.45" />

    <!-- Traditional Round Red Bindi -->
    <circle cx="42" cy="29.5" r="1.8" fill="#B91C1C" />
    <circle cx="42" cy="29.5" r="0.6" fill="#FDE047" />

    <!-- Eyebrows -->
    <path d="M 33 31.5 Q 36 30 39 31.5" stroke="#44403C" stroke-width="1.3" stroke-linecap="round" fill="none" />
    <path d="M 45 31.5 Q 48 30 51 31.5" stroke="#44403C" stroke-width="1.3" stroke-linecap="round" fill="none" />

    <!-- Cheerful Smiling Eyes -->
    <path d="M 33.5 35.5 Q 36.5 33.5 39 35.5" stroke="#1C1917" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 45 35.5 Q 47.5 33.5 50.5 35.5" stroke="#1C1917" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Cartoon Nose -->
    <path d="M 42 36.5 Q 42.8 38.8 41.5 39.5" stroke="#EA580C" stroke-width="1.1" stroke-linecap="round" fill="none" />

    <!-- Warm Sweet Smile with white teeth -->
    <path d="M 37 42.5 Q 42 47.5 47 42.5" stroke="#991B1B" stroke-width="1.5" stroke-linecap="round" fill="#DC2626" />
    <path d="M 38.5 43 Q 42 45 45.5 43" fill="#FFFFFF" />

    <!-- Golden Jhumkas -->
    <circle cx="29" cy="39" r="1.5" fill="#F59E0B" />
    <circle cx="55" cy="39" r="1.5" fill="#F59E0B" />

    <!-- 4. PICKLE BARNI (MARTABAN) -->
    <path d="M 55 56 C 53 64, 55 75, 66 75 C 77 75, 79 64, 77 56 Z" fill="url(#favJarGlaze)" stroke="#854D0E" stroke-width="1.3" />
    <path d="M 55 56 C 55 52, 77 52, 77 56 L 76 62 C 66 64, 66 64, 56 62 Z" fill="url(#favJarOchre)" />
    <ellipse cx="66" cy="52" rx="9.5" ry="2.6" fill="#92400E" />

    <!-- Cloth Cover & Tie -->
    <ellipse cx="66" cy="48" rx="8.5" ry="3.5" fill="#EF4444" />
    <path d="M 56 51 C 56 46, 76 46, 76 51 Q 66 54 56 51 Z" fill="#DC2626" />
    <path d="M 55 52 Q 66 54.5 77 52" stroke="#FEF08A" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Barni Floral Stamp -->
    <circle cx="66" cy="67.5" r="4.5" fill="#B91C1C" />
    <circle cx="66" cy="67.5" r="2.2" fill="#FEF08A" />

    <!-- Hand with bangles -->
    <ellipse cx="54" cy="63" rx="3.5" ry="5.5" fill="#FED7AA" transform="rotate(-15 54 63)" />
    <path d="M 50 67 L 54 68.5" stroke="#DC2626" stroke-width="1.6" stroke-linecap="round" />
  </g>
</svg>